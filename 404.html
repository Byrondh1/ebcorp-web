<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | EB Corp</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-dark);
      position: relative;
      overflow: hidden;
    }

    .error-page::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(26, 43, 95, 0.4) 0%, transparent 70%);
      pointer-events: none;
    }

    .error-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 560px;
    }

    .error-code {
      font-family: 'Space Grotesk', monospace;
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--color-accent-electric), var(--color-accent-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .error-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(245, 166, 35, 0.1);
      border: 1px solid rgba(245, 166, 35, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--color-accent-yellow);
      margin: 0 auto 1.5rem;
      animation: floatY 3s ease-in-out infinite;
    }

    .error-content h1 {
      color: var(--color-white);
      font-size: var(--text-3xl);
      margin-bottom: 1rem;
    }

    .error-content p {
      color: rgba(255,255,255,0.5);
      font-size: var(--text-lg);
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-links {
      margin-top: 3rem;
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-links a {
      color: rgba(255,255,255,0.35);
      font-size: var(--text-sm);
      font-weight: 500;
      transition: color 0.2s;
    }

    .error-links a:hover { color: var(--color-white); }
  </style>
</head>
<body>

  <div class="error-page">
    <div class="error-content">
      <div class="error-icon">
        <i class="fas fa-bolt"></i>
      </div>
      <div class="error-code">404</div>
      <h1>Página no encontrada</h1>
      <p>Parece que esta ruta no existe o fue movida. No te preocupes — volvamos al camino correcto.</p>

      <div class="error-actions">
        <a href="/" class="btn btn-primary btn-lg">
          <i class="fas fa-home"></i> Ir al inicio
        </a>
        <a href="https://wa.me/593961699925?text=Hola%20EB%20Corp,%20necesito%20ayuda"
           class="btn btn-whatsapp btn-lg" target="_blank" rel="noopener">
          <i class="fab fa-whatsapp"></i> Contactar
        </a>
      </div>

      <div class="error-links">
        <a href="/pages/servicios-electricos.html"><i class="fas fa-bolt"></i> Ingeniería Eléctrica</a>
        <a href="/pages/desarrollo-web.html"><i class="fas fa-code"></i> Desarrollo Web</a>
        <a href="/pages/proyectos.html"><i class="fas fa-briefcase"></i> Proyectos</a>
        <a href="/pages/contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
      </div>
    </div>
  </div>

</body>
</html>
